name: Build Wine (CrossOver source)

# Self-reliant Wine pipeline: build CrossOver's Wine from CrossOver's own FOSS source (LGPL, the same
# base Apple's GPTK is built from) and publish it to this repo's Releases, so the app never depends on
# a third-party prebuilt that may go stale. See WINE-BUILD.md.
#
# We do NOT bundle GPTK / D3DMetal — that is Apple-licensed and the user imports it from their own
# GPTK .dmg in the app. This workflow produces Wine only.
#
# CAVEAT: building Wine for macOS is intricate, slow (compiles LLVM/Clang; ~30–60 min) and the exact
# dependencies/flags vary per CrossOver version. This recipe is a faithful starting point that will
# need iteration against real CI logs — it is intentionally manual (workflow_dispatch) and not yet
# validated end-to-end.

on:
  workflow_dispatch:
    inputs:
      crossover_version:
        description: "CrossOver source version, e.g. 26.3.0 (must exist at media.codeweavers.com/pub/crossover/source/)"
        required: true
      release_tag:
        description: "Release tag to publish, e.g. wine-cx-26.3.0"
        required: true
      draft:
        description: "Create the release as a DRAFT (visible only to the repo's maintainers) — for test runs"
        type: boolean
        default: true
  workflow_call:   # invoked by wine-autoupdate.yml when a new CrossOver version appears
    inputs:
      crossover_version:
        required: true
        type: string
      release_tag:
        required: true
        type: string
      draft:
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # One build per CrossOver version; don't cancel an in-flight ~45-min build.
  group: wine-build-${{ inputs.crossover_version }}
  cancel-in-progress: false

jobs:
  build:
    # macos-26 matches the app build (release.yml) + the runtime's deploy target (macOS 26). The build is
    # x86_64 under Rosetta regardless of the runner's host arch.
    runs-on: macos-26
    timeout-minutes: 180
    env:
      # CrossOver is x86_64 (runs on Apple Silicon via Rosetta); build the x86_64 Wine.
      ARCH_PREFIX: "arch -x86_64"
    steps:
      - uses: actions/checkout@v7

      - name: Host tools (native Homebrew) + Rosetta
        run: |
          set -eo pipefail
          # Same script as Scripts/build-wine.sh. No x86_64 Homebrew: its installer refuses Intel installs now
          # ("only supported on Apple Silicon" — this workflow's first run failed on it, 2026-09-29). The tools
          # only run on the runner; every x86_64 library the runtime ships is built from source below.
          ./Scripts/host-tools.sh | tail -1 | tr ':' '\n' >> "$GITHUB_PATH"   # one directory per line
          xcodebuild -version   # MoltenVK (build-deps step) needs full Xcode

      - name: Fetch CrossOver source
        run: |
          set -eo pipefail
          VER="${{ inputs.crossover_version }}"
          URL="https://media.codeweavers.com/pub/crossover/source/crossover-sources-${VER}.tar.gz"
          echo "Downloading $URL"
          curl -fL "$URL" -o crossover-sources.tar.gz
          mkdir -p src && tar -xzf crossover-sources.tar.gz -C src
          # The tarball contains a wine source tree (path varies by version: sources/wine or wine).
          WINE_SRC=$(find src -maxdepth 3 -type d -name wine | head -1)
          test -n "$WINE_SRC"
          echo "WINE_SRC=$WINE_SRC" >> "$GITHUB_ENV"

      - name: Apply Silo patches to the CrossOver source
        run: |
          set -eo pipefail
          # Mirror of the same loop in Scripts/build-wine.sh — keep the two in step. Each patch must
          # apply; a silently-skipped one would publish a runtime that looks patched but isn't.
          for p in Scripts/patches/*.patch; do
            [ -e "$p" ] || break
            echo "==> Apply $(basename "$p")"
            ( cd "$WINE_SRC" && patch -p1 --forward < "$GITHUB_WORKSPACE/$p" ) || {
              echo "ERROR: $(basename "$p") did not apply to CrossOver source ${{ inputs.crossover_version }} — rebase it"
              exit 1
            }
          done

      - name: Build CrossOver's GStreamer (1.24.4 + libav + matroska) from the source tarball
        run: |
          set -eo pipefail
          # Same as Scripts/build-wine.sh: winegstreamer must compile against the GStreamer/glib it runs on.
          SILO_CX_SOURCES="$GITHUB_WORKSPACE/$(dirname "$WINE_SRC")" ./Scripts/build-gst-libav.sh
          echo "GST_PREFIX=$GITHUB_WORKSPACE/.wine-build/gst/prefix" >> "$GITHUB_ENV"
          echo "GST_STACK=$(ls -d "$GITHUB_WORKSPACE"/dist/gstreamer-*/lib64 | sort -V | tail -1)" >> "$GITHUB_ENV"
          # The libav + matroska add-on on its own, for a Wine imported from CrossOver (whose GStreamer lacks
          # them): Silo's importer fetches the `gst-libav-<gstreamer version>` release matching the import's
          # GStreamer (GStreamerAddOn). Same package Scripts/add-gst-libav.sh adds by hand.
          ADDON="$(ls -d "$GITHUB_WORKSPACE"/dist/gst-libav-* | sort -V | tail -1)"
          GST_ADDON_VER="$(cat "$ADDON/GSTREAMER_VERSION")"
          tar -cJf "$GITHUB_WORKSPACE/gst-libav-$GST_ADDON_VER.tar.xz" -C "$ADDON" .
          ( cd "$GITHUB_WORKSPACE" && shasum -a 256 "gst-libav-$GST_ADDON_VER.tar.xz" > "gst-libav-$GST_ADDON_VER.tar.xz.sha256" )
          echo "GST_ADDON_VER=$GST_ADDON_VER" >> "$GITHUB_ENV"

      - name: Build the shipped libraries from source (gmp, nettle, gnutls, freetype, MoltenVK)
        run: |
          set -eo pipefail
          # Same script as Scripts/build-wine.sh — the versions and dependency shape of CrossOver's own lib64.
          SILO_CX_SOURCES="$GITHUB_WORKSPACE/$(dirname "$WINE_SRC")" ./Scripts/build-deps.sh
          echo "DEPS_PREFIX=$GITHUB_WORKSPACE/.wine-build/deps/prefix" >> "$GITHUB_ENV"

      - name: Pinned mingw-w64 cross compiler (Wine's Windows-side DLLs)
        run: |
          set -eo pipefail
          # Same script as Scripts/build-wine.sh: the exact bottle (versions.env), never "whatever brew has".
          MINGW="$(./Scripts/pin-mingw-w64.sh "$GITHUB_WORKSPACE/toolchains" | tail -1)"
          # winegcc links through the target-named driver on PATH, so only these tools go first on PATH.
          SHIM="$GITHUB_WORKSPACE/toolchains/mingw-shim"
          rm -rf "$SHIM" && mkdir -p "$SHIM" && ln -s "$MINGW"/bin/*-w64-mingw32-* "$SHIM"/
          echo "MINGW=$MINGW" >> "$GITHUB_ENV"
          echo "$SHIM" >> "$GITHUB_PATH"

      - name: Build pinned SDL (winebus game-controller backend)
        run: |
          set -eo pipefail
          # Build the EXACT SDL CrossOver ships (versions.env SDL_VERSION) from libsdl-org source, x86_64 to
          # match Wine. Gives Wine's --with-sdl its headers AND the runtime dylib we bundle. A generic
          # Homebrew libSDL2 aborted Wine off the main thread; this pinned build does not.
          # cmake is native (host tool); both Homebrew roots are kept out of its search (see build-wine.sh).
          set -a; . "$GITHUB_WORKSPACE/versions.env"; set +a
          SDK="$(xcrun --show-sdk-path)"
          SDL_PREFIX="$GITHUB_WORKSPACE/sdl-install"
          curl -fL "https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VERSION}/SDL2-${SDL_VERSION}.tar.gz" -o sdl.tar.gz
          rm -rf sdl-src sdl-build "$SDL_PREFIX" && mkdir sdl-src && tar -xzf sdl.tar.gz -C sdl-src --strip-components=1
          cmake -S sdl-src -B sdl-build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DCMAKE_OSX_SYSROOT="$SDK" \
            -DCMAKE_IGNORE_PREFIX_PATH="/opt/homebrew;/usr/local" \
            -DCMAKE_INSTALL_PREFIX="$SDL_PREFIX" -DSDL_SHARED=ON -DSDL_STATIC=OFF
          cmake --build sdl-build -j"$(sysctl -n hw.ncpu)"
          cmake --install sdl-build
          test -f "$SDL_PREFIX/lib/libSDL2-2.0.0.dylib"
          echo "SDL_PREFIX=$SDL_PREFIX" >> "$GITHUB_ENV"

      - name: Configure + build Wine (wow64, x86_64)
        run: |
          set -eo pipefail
          SDK="$(xcrun --show-sdk-path)"
          # Only Silo's own prefixes are visible (see Scripts/build-wine.sh): the GStreamer prefix FIRST
          # (LDFLAGS precede pkg-config's -L), and PKG_CONFIG_LIBDIR replaces the native pkgconf's default
          # search path, which is the arm64 Homebrew's .pc files.
          export PKG_CONFIG="$(command -v pkgconf)"
          export PKG_CONFIG_LIBDIR="$GST_PREFIX/lib/pkgconfig:$SDL_PREFIX/lib/pkgconfig:$DEPS_PREFIX/lib/pkgconfig"
          export PKG_CONFIG_PATH=
          export CPPFLAGS="-I$SDL_PREFIX/include -I$DEPS_PREFIX/include"
          # The lib64 rpath is CrossOver's own (see Scripts/build-wine.sh): bundle-wine-dylibs.sh puts every
          # third-party dylib there with an @rpath install name; headerpad leaves room for its rewrites.
          export LDFLAGS="-L$GST_PREFIX/lib -L$SDL_PREFIX/lib -L$DEPS_PREFIX/lib -Wl,-rpath,@loader_path/../../../lib64 -Wl,-headerpad_max_install_names"
          # -isysroot: no default /usr/local search paths (the runner pre-seeds /usr/local with its own files).
          export CC="clang -arch x86_64 -isysroot $SDK"
          export CXX="clang++ -arch x86_64 -isysroot $SDK"
          pkg-config --modversion gnutls freetype2
          mkdir -p build wine-install
          cd build
          # Single wow64 tree (32+64-bit PE) — adjust flags per CrossOver version as CI reveals.
          #
          # -fvisibility=default: build Wine with all symbols visible so winemac.drv ('macdrv') exposes its
          # Metal/window-surface helpers via dlsym — this is what lets GPTK/D3DMetal GAMES present (without
          # it D3D→Metal output is black for layered windows). It is NOT what fixes the Steam *client* CEF
          # UI: that black window is fixed at RUNTIME by forcing CEF onto its SwiftShader software-GL
          # renderer (the --in-process-gpu steamwebhelper wrapper, see SteamBottle). Set on BOTH
          # CFLAGS and CROSSCFLAGS. -O2 restores the optimization an explicit CFLAGS would otherwise drop.
          $ARCH_PREFIX env CFLAGS="-fvisibility=default -O2" CROSSCFLAGS="-fvisibility=default -O2" \
            PKG_CONFIG="$PKG_CONFIG" PKG_CONFIG_LIBDIR="$PKG_CONFIG_LIBDIR" PKG_CONFIG_PATH= \
            "$GITHUB_WORKSPACE/$WINE_SRC/configure" \
            --prefix="$GITHUB_WORKSPACE/wine-install" \
            --enable-archs=i386,x86_64 \
            --disable-tests --without-x \
            --with-freetype --with-gstreamer --with-gnutls \
            --with-sdl \
            x86_64_CC="$MINGW/bin/x86_64-w64-mingw32-gcc" i386_CC="$MINGW/bin/i686-w64-mingw32-gcc"
          # --with-sdl: winebus's SDL controller backend; dlopens the pinned libSDL2 bundled below (Map Controllers → XInput).
          # x86_64_CC / i386_CC: the pinned mingw-w64 (step above).
          # /usr/bin/make: universal (an Xcode-provided make can be arm64-only → "Bad CPU type" under arch).
          # Build tools that link a shipped library (sfnt2fon → freetype) resolve it through the runtime's
          # rpath @loader_path/../../../lib64 = $GITHUB_WORKSPACE/lib64 from build/tools/<tool>/ (see build-wine.sh).
          ln -sfn "$DEPS_PREFIX/lib" "$GITHUB_WORKSPACE/lib64"
          $ARCH_PREFIX /usr/bin/make -j"$(sysctl -n hw.ncpu)"
          $ARCH_PREFIX /usr/bin/make install
          rm -f "$GITHUB_WORKSPACE/lib64"
          test -x "$GITHUB_WORKSPACE/wine-install/bin/wine64" || test -x "$GITHUB_WORKSPACE/wine-install/bin/wine"
          # steamwebhelper wrapper (forces CEF --in-process-gpu + software GL so Steam's UI paints) — shipped in the runtime.
          mkdir -p "$GITHUB_WORKSPACE/wine-install/share/silo"
          WRAPPER="$GITHUB_WORKSPACE/wine-install/share/silo/steamwebhelper-wrapper.exe"
          "$MINGW/bin/x86_64-w64-mingw32-gcc" -O2 -municode -mwindows \
            -o "$WRAPPER" "$GITHUB_WORKSPACE/Scripts/steamwebhelper-wrapper.c"
          # The wrapper is load-bearing — fail the build if its CEF flags are wrong. Same shared check the
          # local Scripts/build-wine.sh runs, so the local + CI guards can't drift.
          python3 "$GITHUB_WORKSPACE/Scripts/check-webhelper-wrapper.py" "$WRAPPER"

      - name: Bundle dependency dylibs + GStreamer into lib64 (self-contained, CrossOver's layout)
        # SILO_DEPS_PREFIX: the dlopen()ed libs come from build-deps.sh's prefix (a Homebrew one is an error).
        # SILO_SDL_DYLIB ships our pinned libSDL2 (winebus dlopens it by leaf name, resolved via the lib64 rpath).
        run: SILO_DEPS_PREFIX="$DEPS_PREFIX" SILO_GST_STACK="$GST_STACK" SILO_SDL_DYLIB="$SDL_PREFIX/lib/libSDL2-2.0.0.dylib" ./Scripts/bundle-wine-dylibs.sh "$GITHUB_WORKSPACE/wine-install"

      - name: Sign the Wine tree (ad-hoc)
        # Same script as Scripts/build-wine.sh. Without it the loader's embedded Info.plist is ignored and
        # Stage Manager shows Steam's window with no icon at all (see the script).
        run: ./Scripts/sign-wine-tree.sh "$GITHUB_WORKSPACE/wine-install"

      - name: Package wine.tar.xz
        run: |
          set -eo pipefail
          # New WoW64 builds install a unified `wine`; add a wine64 alias for consumers expecting it.
          if [ -e wine-install/bin/wine ] && [ ! -e wine-install/bin/wine64 ]; then
            ( cd wine-install/bin && ln -s wine wine64 )
          fi
          ( cd wine-install && tar -cJf "$GITHUB_WORKSPACE/wine.tar.xz" . )
          shasum -a 256 wine.tar.xz > wine.tar.xz.sha256   # the app verifies this before extracting
          ls -la wine.tar.xz wine.tar.xz.sha256

      - name: Publish the libav add-on (gst-libav-<gstreamer version>, for imported CrossOver Wine)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: gst-libav-${{ env.GST_ADDON_VER }}
          name: gst-libav-${{ env.GST_ADDON_VER }}
          draft: ${{ inputs.draft }}
          files: |
            gst-libav-${{ env.GST_ADDON_VER }}.tar.xz
            gst-libav-${{ env.GST_ADDON_VER }}.tar.xz.sha256
          body: "gst-libav + matroska (FFmpeg decoders, LGPL) for GStreamer ${{ env.GST_ADDON_VER }} — CrossOver's own. Silo adds it to a Wine imported from CrossOver. See WINE-BUILD.md."

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_tag }}
          # Manual runs default to a draft: nothing is public until someone presses "Publish" on GitHub.
          draft: ${{ inputs.draft }}
          files: |
            wine.tar.xz
            wine.tar.xz.sha256
          body: "CrossOver Wine ${{ inputs.crossover_version }} built from CrossOver FOSS source (LGPL). Pair with Apple GPTK/D3DMetal imported from the .dmg in-app. See WINE-BUILD.md."
